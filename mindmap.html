<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Map – Ask Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Dark (default) */
    :root {
      --bg: #1e1e2e;
      --bg-header: #16213e;
      --border: #2d3561;
      --text: #e2e8f0;
      --text-muted: #a0aec0;
      --accent: #667eea;
      --toolbar-hover: #2d3561;
      --error: #fc8181;
      /* markmap overrides for dark */
      --markmap-text-color: #e2e8f0;
      --markmap-code-bg: #1a1b26;
      --markmap-code-color: #ddd;
      --markmap-circle-open-bg: #fff;
    }
    /* Light */
    [data-theme="light"] {
      --bg: #f8f9fa;
      --bg-header: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --text-muted: #718096;
      --accent: #667eea;
      --toolbar-hover: #e2e8f0;
      --error: #e53e3e;
      --markmap-text-color: #333;
      --markmap-code-bg: #f0f0f0;
      --markmap-code-color: #555;
      --markmap-circle-open-bg: #fff;
    }

    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }

    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; opacity: 0.9; flex: 1; }

    #svg-container { flex: 1; overflow: hidden; position: relative; }
    svg#mindmap {
      width: 100%;
      height: 100%;
      display: block;
      /* push markmap CSS variables so embedded styles pick them up */
      --markmap-text-color: var(--markmap-text-color);
      --markmap-code-bg: var(--markmap-code-bg);
      --markmap-code-color: var(--markmap-code-color);
      --markmap-circle-open-bg: var(--markmap-circle-open-bg);
    }

    /* markmap-toolbar */
    .mm-toolbar {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      user-select: none;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-header);
      padding: 4px;
      line-height: 1;
    }
    .mm-toolbar:hover { border-color: var(--accent); }
    .mm-toolbar svg { display: block; }
    .mm-toolbar-brand { display: none; }
    .mm-toolbar-item:not(:first-child) { margin-left: 4px; }
    .mm-toolbar-item > * {
      min-width: 1rem; cursor: pointer; text-align: center;
      font-size: 12px; line-height: 1rem; color: var(--text-muted);
    }
    .mm-toolbar-item:hover, .mm-toolbar-item.active {
      border-radius: 4px; background: var(--toolbar-hover);
    }
    .mm-toolbar-item:hover > *, .mm-toolbar-item.active > * { color: var(--text); }

    #error { padding: 40px; text-align: center; color: var(--error); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="url(#g)" stroke-width="2"/>
        <path d="M16 8v8l6 4" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
            <stop stop-color="#667eea"/><stop offset="1" stop-color="#764ba2"/>
          </linearGradient>
        </defs>
      </svg>
      <h1 id="title">Mind Map</h1>
    </header>
    <div id="svg-container">
      <svg id="mindmap"></svg>
    </div>
    <div id="error" style="display:none"></div>
  </div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/markmap-view.js"></script>
  <script src="vendor/markmap-lib.js"></script>
  <script src="vendor/markmap-toolbar.js"></script>
  <script src="utils.js"></script>
  <script src="mindmap.js"></script>
</body>
</html>
